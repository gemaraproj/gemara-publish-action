name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: YAML syntax (action.yml)
        run: ruby -ryaml -e "YAML.load_file('action.yml'); puts 'action.yml OK'"

      - name: Go (cmd/grc)
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: cmd/grc/go.mod
          cache-dependency-path: cmd/grc/go.sum

      - name: Build grc
        run: go build -C cmd/grc -o "${RUNNER_TEMP}/grc" .

      - name: Validate + assemble + pack (dry run)
        run: |
          set -euo pipefail
          cd testdata
          GEMARA_REGISTRY_PASSWORD=ci-dummy "${RUNNER_TEMP}/grc" \
            -registry=localhost:5000 \
            -repository=ci/test \
            -tag=ci \
            -file=minimal-catalog.yaml \
            -username=ci \
            -validate=true 2>&1 | tee /tmp/publish-out.txt || true
          if grep -q "^assemble:" /tmp/publish-out.txt; then
            echo "::error::Assemble failed"
            exit 1
          fi
          if grep -q "^validate:" /tmp/publish-out.txt; then
            echo "::error::Validation failed"
            exit 1
          fi
          if grep -q "^pack:" /tmp/publish-out.txt; then
            echo "::error::Pack failed"
            exit 1
          fi
          echo "Assemble + pack succeeded (push expected to fail — no registry)"
