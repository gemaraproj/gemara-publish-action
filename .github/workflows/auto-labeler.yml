---
name: "Auto Labeler"
on:
  pull_request_target:
    types: [opened, reopened, edited]
permissions:
  contents: read
jobs:
  auto_labeler:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/auto-labeler.yaml@690dbbefe65f0c1d68c5211dd6ff997f533099b5 # v2.2.0
    with:
      config-name: release-drafter.yml@${{ github.base_ref }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
