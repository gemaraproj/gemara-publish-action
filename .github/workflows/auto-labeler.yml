---
name: "Auto Labeler"
on:
  pull_request_target:
    types: [opened, reopened, edited]
permissions:
  contents: read
jobs:
  auto_labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/auto-labeler.yaml@13d124b245cf85ba41d9dd58d6888979043f1a29 # v1.2.3
    with:
      config-name: release-drafter.yml@${{ github.base_ref }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
