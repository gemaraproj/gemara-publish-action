---
name: "Release"
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
jobs:
  release:
    permissions:
      contents: write
      pull-requests: read
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/release-minimal.yaml@ee8277bd76ef808b3a6e0bdd1f5a46a520a12c5d # v2.3.1
    with:
      publish: true
      release-config-name: release-drafter.yml
      release-only-with-label: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
