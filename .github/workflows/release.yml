---
name: "Release"
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
jobs:
  release:
    permissions:
      contents: write
      pull-requests: read
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/release-minimal.yaml@3e055d5fc59e62419fb3103d96fd116ddcf89c8c # v2.3.0
    with:
      publish: true
      release-config-name: release-drafter.yml
      release-only-with-label: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
